<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" shape-rendering="crispEdges">
  <defs>
    <pattern id="dither" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="8" y="8" width="8" height="8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1126"/>
      <stop offset="1" stop-color="#08091a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect y="640" width="1920" height="440" fill="url(#dither)"/>
  <rect x="0" y="960" width="1920" height="120" fill="#ffd166" fill-opacity="0.06"/>
  <g fill="#ffd166" fill-opacity="0.9">
    <rect x="800" y="180" width="12" height="12"/><rect x="1500" y="260" width="8" height="8"/><rect x="300" y="420" width="8" height="8"/><rect x="1700" y="520" width="12" height="12"/><rect x="900" y="120" width="8" height="8"/>
  </g>
  <rect x="48" y="48" width="1824" height="984" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-dasharray="16 16"/>
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#eef0ff">
    <text x="960" y="520" font-size="84" font-weight="700" letter-spacing="8">PLACEHOLDER</text>
    <text x="960" y="590" font-size="34" fill="#9b9fc2">Your next project - UI screen 1</text>
    <text x="960" y="650" font-size="26" fill="#5e6288">replace this file with a real 16:9 screenshot</text>
  </g>
</svg>
