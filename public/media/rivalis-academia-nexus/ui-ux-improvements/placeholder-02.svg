<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1424"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="70%">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect x="60" y="60" width="1800" height="960" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="14 14"/>
  <g font-family="Sora, Inter, Segoe UI, sans-serif" text-anchor="middle" fill="#e8ecf4">
    <text x="960" y="520" font-size="72" font-weight="600" letter-spacing="2">PLACEHOLDER</text>
    <text x="960" y="590" font-size="34" fill="#8b94a8">UI/UX Improvements — screenshot 2</text>
    <text x="960" y="650" font-size="26" fill="#5c6578" font-family="JetBrains Mono, Consolas, monospace">Replace this file with a real 16:9 screenshot</text>
  </g>
</svg>
